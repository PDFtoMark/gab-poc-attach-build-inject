name: Build pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  fake_build:
    runs-on: ubuntu-latest
    steps:
      - name: forge pr_number artifact
        run: |
          mkdir -p pr
          echo '' | base64 -d > pr/pr_number
          echo 'dummy build' > build.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr_number
          path: pr/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerion-wallet-extension
          path: build.txt
